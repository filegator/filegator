# Publish the container image to Docker Hub on a release tag.
#
# Every `v8*` tag builds all five published platforms and pushes two tags:
# the release (`v8.x.x`) and the moving `v8`.
#
# The build needs no qemu: the Dockerfile cross-compiles in a
# `FROM --platform=$BUILDPLATFORM` stage and its runtime stage has no `RUN`,
# only `COPY`. That is why there is no `docker/setup-qemu-action` step; adding
# one would hide the fact that the build no longer has that property.
#
# The checks are repeated in this job rather than relying on the Tests
# workflow: a tag push is not a branch push, and `needs` cannot reach across
# workflow files. They run before the Docker Hub login, so a red tag publishes
# nothing and never touches the registry.

name: Docker Hub

on:
  push:
    tags:
      - "v8*"

permissions:
  contents: read

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    env:
      GOPROXY: "off"
      GOFLAGS: "-mod=vendor"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The tag is the release number. Write it into version.go before any
      # check or build, so the image reports the tag it is published under. A
      # manual bump is not needed.
      - name: Set release version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sed -i "s|^const Version = .*|const Version = \"${VERSION}\"|" internal/version/version.go
          gofmt -w internal/version/version.go
          grep -Fq "const Version = \"${VERSION}\"" internal/version/version.go

      # The rewrite above is the guard; this catches a step that silently
      # stopped matching version.go.
      - name: Release version
        env:
          FILEGATOR_RELEASE_TAG: ${{ github.ref_name }}
        run: go test ./internal/version -run TestVersionMatchesReleaseTag -count=1

      - name: Formatting
        run: make lint

      - name: Tests
        run: go test ./... -count=1

      - name: Documentation
        run: make docs-check

      - name: Build
        run: make build

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: true
          # Must match the source rewrite above; the image reports this value.
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            filegator/filegator:${{ github.ref_name }}
            filegator/filegator:v8
