# Publish the container image to Docker Hub on a release tag.
#
# Every `v8*` tag builds all five published platforms and pushes two tags:
# the release (`v8.x.x`) and the moving `v8`.
#
# The build needs no qemu: the Dockerfile cross-compiles in a
# `FROM --platform=$BUILDPLATFORM` stage and its runtime stage has no `RUN`,
# only `COPY`. That is why there is no `docker/setup-qemu-action` step; adding
# one would hide the fact that the build no longer has that property.

name: Docker Hub

on:
  push:
    tags:
      - "v8*"

permissions:
  contents: read

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: true
          tags: |
            filegator/filegator:${{ github.ref_name }}
            filegator/filegator:v8
